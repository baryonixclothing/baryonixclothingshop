<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Cotton BARYONIX Tee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#090a08;--lime:#d2ed42;--line:#34382f}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 10%,rgba(210,237,66,.04),transparent 28%),#10120f;color:#f3f4ed;font-family:"DM Sans",sans-serif}
    header{height:96px;max-width:1180px;margin:auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between}.brand img{height:78px;width:auto;object-fit:contain}.back{color:#f3f4ed;text-decoration:none;font-weight:700}
    main{max-width:1180px;margin:auto;padding:28px;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(320px,.72fr);gap:48px}.gallery{height:min(680px,70vh);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#171914}.gallery img{width:100%;height:100%;object-fit:cover}
    .details{padding:32px 0}.eyebrow{color:var(--lime);font-family:"Oswald";letter-spacing:.12em;text-transform:uppercase;font-size:12px}.details h1{font-family:"Oswald";font-size:clamp(42px,6vw,72px);line-height:.98;text-transform:uppercase;margin:12px 0}.price{font-size:26px;font-weight:700;color:var(--lime);margin:18px 0}.description{color:#b6baa9;line-height:1.7}.label{display:block;font-size:13px;font-weight:700;margin:24px 0 10px}.sizes{display:flex;gap:8px}.sizes button{height:44px;min-width:48px;border:1px solid #454941;border-radius:8px;background:#171914;color:#f3f4ed;font-weight:700}.sizes button.active,.sizes button:hover{background:var(--lime);color:var(--ink);border-color:var(--lime)}
    .cart-button{width:100%;height:56px;border:0;border-radius:999px;background:var(--lime);color:var(--ink);font-weight:800;margin-top:28px}.cart-button:hover{filter:brightness(.92)}.checkout{display:block;text-align:center;margin-top:14px;color:#b6baa9;font-size:13px}
    @media(min-width:1500px){header,main{max-width:1380px}.gallery{height:min(760px,72vh)}}
    @media(max-width:760px){header{height:82px;padding:0 16px}.brand img{height:64px}main{grid-template-columns:1fr;padding:14px;gap:18px}.gallery{height:52vh}.details{padding:12px 0}.sizes{overflow-x:auto;flex-wrap:nowrap}}
    @media(max-width:380px){.brand img{height:56px}.back{font-size:13px}.sizes button{min-width:44px}.details h1{font-size:38px}}
    :focus-visible{outline:3px solid var(--lime);outline-offset:3px}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
<header><a class="brand" href="index.html" aria-label="BARYONIX home"><img src="official baryonix logo.png" alt="BARYONIX"></a><a class="back" href="index.html">← Back to shop</a></header>
<main>
  <section class="gallery"><img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=1200&q=90" alt="Premium Cotton BARYONIX Tee"></section>
  <section class="details"><p class="eyebrow">Premium essential</p><h1>Premium Cotton BARYONIX Tee</h1><div class="price">£22.64</div><p class="description">Heavyweight premium cotton engineered for comfort, durability, and unrestricted movement. Made for training—and built to stand apart.</p><span class="label">Select size</span><div class="sizes"><button class="active">S</button><button>M</button><button>L</button><button>XL</button><button>XXL</button></div><button class="cart-button" id="addCart">Add to cart</button><a class="checkout" href="page2 index.html">Go to checkout</a></section>
</main>
<script>
  document.querySelectorAll('.sizes button').forEach(button=>button.addEventListener('click',()=>{document.querySelector('.sizes .active').classList.remove('active');button.classList.add('active')}));
  document.getElementById('addCart').addEventListener('click',()=>{const size=document.querySelector('.sizes .active').textContent;const cart=JSON.parse(localStorage.getItem('baryonixCart')||'[]');const item=cart.find(p=>p.id===1&&p.size===size);item?item.qty++:cart.push({id:1,size,qty:1});localStorage.setItem('baryonixCart',JSON.stringify(cart));window.location.href='index.html'});
</script>
</body></html>
